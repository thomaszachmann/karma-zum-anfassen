global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: notes-api
    static_configs:
      - targets: ["notes-api-dev:8080"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager-dev:9093"]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: notes-api
    static_configs:
      - targets: ["notes-api:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: karma
    static_configs:
      - targets: ["karma:8080"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
            - alertmanager-2:9093
            - alertmanager-3:9093
